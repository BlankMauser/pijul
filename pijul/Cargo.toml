[package]
name = "pijul"
description = "A distributed version control system."
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license = "GPL-2.0-or-later"
readme.workspace = true
include = [
    "Cargo.toml",
    "src/main.rs",
    "src/replay_log.rs",
    "src/commands/apply.rs",
    "src/commands/archive.rs",
    "src/commands/change.rs",
    "src/commands/channel.rs",
    "src/commands/client.html",
    "src/commands/client.rs",
    "src/commands/clone.rs",
    "src/commands/common_opts.rs",
    "src/commands/completions.rs",
    "src/commands/credit.rs",
    "src/commands/debug.rs",
    "src/commands/dependents.rs",
    "src/commands/diff.rs",
    "src/commands/docgen.rs",
    "src/commands/file_operations.rs",
    "src/commands/fork.rs",
    "src/commands/git.rs",
    "src/commands/hooks.rs",
    "src/commands/http_token.rs",
    "src/commands/identity.rs",
    "src/commands/init.rs",
    "src/commands/log.rs",
    "src/commands/mod.rs",
    "src/commands/protocol.rs",
    "src/commands/pushpull.rs",
    "src/commands/record.rs",
    "src/commands/replay.rs",
    "src/commands/reset.rs",
    "src/commands/status.rs",
    "src/commands/unrecord.rs",
    "src/commands/upgrade.rs",
]

[features]
git = ["pijul-core/git2", "git2"]
default = ["openssl", "git"]
openssl = ["pijul-identity/openssl", "pijul-remote/openssl"]

[dependencies]
pijul-core = { workspace = true, features = ["tarball"] }
pijul-config.workspace = true
pijul-identity.workspace = true
pijul-interaction.workspace = true
pijul-remote.workspace = true
pijul-repository.workspace = true
palimpsest.workspace = true

anyhow.workspace = true
byteorder.workspace = true
canonical-path.workspace = true
clap = { workspace = true, features = ["derive", "cargo"] }
clap_complete.workspace = true
clap_mangen.workspace = true
ctrlc.workspace = true
data-encoding.workspace = true
edit.workspace = true
env_logger.workspace = true
git2 = { workspace = true, optional = true }
human-panic.workspace = true
hyper.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper-util.workspace = true
ignore.workspace = true
jiff.workspace = true
log.workspace = true
open.workspace = true
path-slash.workspace = true
ptree.workspace = true
rand.workspace = true
regex.workspace = true
sanakirja.workspace = true
serde_derive.workspace = true
serde_json.workspace = true
serde.workspace = true
tempfile.workspace = true
termcolor.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true
validator.workspace = true
rand_distr = "0.6.0"

[target.'cfg(unix)'.dependencies]
pager.workspace = true
