[package]
name = "palimpsest"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-or-later OR GPL-2.0-or-later"
readme = "README.md"
description = "Full-context, three-colour annotation of a Pijul change: what it added, what it removed, and what it added that was later removed — inlined in the whole file, as a renderer-agnostic segment stream."

[dependencies]
pijul-core = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = "0.1.44"

# Tree-sitter, for structural (nested) fold computation over the alive
# file. Grammars for a core set plus a few requested extras; anything
# without a grammar falls back to the client's indentation heuristic.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-json = "0.24"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-nix = "0.3"
tree-sitter-svelte-ng = "1.0"
tree-sitter-ocaml = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-haskell = "0.23"

[dev-dependencies]
env_logger = "0.11"
tempfile = "3"
regex = "1"
