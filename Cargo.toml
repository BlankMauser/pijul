[workspace]
members = [
    "pijul-core",
    "pijul-config",
    "pijul-identity",
    "pijul-interaction",
    "pijul-macros",
    "pijul-remote",
    "pijul-repository",
    "pijul",
    "palimpsest"
]
resolver = "3"

[workspace.package]
version = "1.0.0-beta.22"
authors = ["Pierre-Étienne Meunier <pe@pijul.org>"]
edition = "2024"
repository = "https://nest.pijul.com/pijul/pijul"
license = "GPL-2.0"
readme = "README.md"

[workspace.dependencies]
pijul-core = { path = "pijul-core", version = "1.0.0-beta.22" }
pijul-config = { path = "pijul-config", version = "1.0.0-beta.22" }
pijul-identity = { path = "pijul-identity", version = "1.0.0-beta.22" }
pijul-interaction = { path = "pijul-interaction", version = "1.0.0-beta.15" }
pijul-macros = { path = "pijul-macros", version = "1.0.0-beta.13" }
pijul-remote = { path = "pijul-remote", version = "1.0.0-beta.22" }
pijul-repository = { path = "pijul-repository", version = "1.0.0-beta.15" }
palimpsest = { path = "./palimpsest", version = "0.3.0" }

adler32 = "1.2"
anyhow = "1.0"
bincode = "1.3"
bitflags = "2.9"
blake3 = "1.8"
byteorder = "1.5"
bytes = "1.10"
canonical-path = "2.0"
chardetng = "1.0"
clap = "4.5"
clap_complete = "4.5"
clap_mangen = "0.3"
crossbeam-deque = "0.8"
ctrlc = "3.4"
curve25519-dalek = "5.0"
data-encoding = "2.9"
dialoguer = { version = "0.12", default-features = false }
diffs = "0.5"
dirs-next = "2.0"
duplicate = "2.0"
edit = "0.1"
encoding_rs = "0.8"
env_logger = "0.11"
expectrl = "0.7"
figment = { version = "0.10", features = ["toml"] }
flate2 = "1.1"
futures = "0.3"
futures-util = "0.3"
getrandom = "0.4"
git2 = "0.21"
human-panic = "2.0"
hyper = { version = "1", features = ["http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio", "server"] }
ignore = "0.4"
imara-diff = "0.1.8"
indicatif = { version = "0.17", features = ["improved_unicode"] }
jiff = { version = "0.2", features = ["serde", "alloc"] }
log = "0.4"
lru-cache = "0.1"
nom = "7.1"
open = "5.3"
pager = "0.16"
parking_lot = "0.12"
path-slash = "0.2"
proc-macro2 = "1.0"
ptree = { version = "0.5", default-features = false, features = ["ansi"] }
quickcheck = "1.0"
quote = "1.0"
rand = "0.10"
rand_chacha = "0.10"
regex = "1.11"
reqwest = { version = "0.13", features = ["stream", "json", "query"] }
rlimit = "0.11"
sanakirja = { version = "2.0.0-beta", default-features = false, features = ["crc32"] }
serde = { version = "1.0", features = [ "serde_derive" ] }
serde_derive = "1.0"
serde_json = "1.0"
sha2 = "0.11"
syn = "3.0"
tar = "0.4"
tempfile = "3.20"
termcolor = "1.4"
thiserror = "2.0"
thrussh = "0.49.0"
thrussh-config = "0.6"
thrussh-keys = "0.44.0"
tokio = { version = "1.45", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
] }
toml = { version = "0.8", features = ["preserve_order"] }
twox-hash = "1.6"
url = "2.5"
validator = "0.21"
whoami = { version = "2.1", default-features = false }
zstd-seekable = "0.1"
